services:
  postgres:
    image: postgres:18-alpine
    container_name: plataforma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      POSTGRES_DB: plataforma
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 declares its volume at /var/lib/postgresql, not
      # /var/lib/postgresql/data like every release before it.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:

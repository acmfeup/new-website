name: Deploy API

# Every merge to main that can change the API image. The GCP resources and the
# three repository variables come from infra/setup-gcp.sh.
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/config/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through a migration.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the job request the OIDC token that Workload Identity Federation trades
  # for short-lived GCP credentials. There is no service account key anywhere.
  id-token: write

env:
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/api/api:${{ github.sha }}
  RUNTIME_SA: api-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      # Runs inside GCP as the runtime account, so the connection string never
      # reaches this runner. --wait makes the step fail if the migration fails,
      # which stops the workflow before the new revision is deployed: the
      # previous one keeps serving.
      - name: Run migrations
        run: |
          gcloud run jobs deploy api-migrate \
            --region="$REGION" \
            --image="$IMAGE" \
            --command=node --args=dist/db/migrate.js \
            --service-account="$RUNTIME_SA" \
            --set-secrets=DATABASE_URL=database-url:latest \
            --max-retries=0 --task-timeout=5m \
            --execute-now --wait

      # ^;^ switches gcloud's list separator so the comma stays inside CORS_ORIGIN.
      - name: Deploy the service
        run: |
          gcloud run deploy api \
            --region="$REGION" \
            --image="$IMAGE" \
            --port=4000 \
            --service-account="$RUNTIME_SA" \
            --set-secrets=DATABASE_URL=database-url:latest \
            --set-env-vars="^;^CORS_ORIGIN=https://acmfeup.eu,https://www.acmfeup.eu" \
            --min-instances=0 --max-instances=2 \
            --cpu=1 --memory=512Mi \
            --quiet

      # Retries cover the cold start of the new instance and of Neon's compute.
      - name: Check /health
        run: |
          url="$(gcloud run services describe api --region="$REGION" --format='value(status.url)')"
          curl -fsS --retry 5 --retry-all-errors "$url/health"
